19px;margin:22px 0 10px;line-height:1.3}p{color:#c6cee1;margin:10px 0 14px}.lead{font-size:18px;max-width:780px}.panel{border:1px solid var(--edge);border-radius:16px;background:linear-gradient(135deg,#151b2a,#101520);padding:24px;margin:17px 0}.panel.subtle{background:#111621}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:17px;border-radius:13px;background:#1c2537;border:1px solid #35405a}.stat strong{display:block;font-size:23px;line-height:1.3;color:white}.stat small{color:var(--muted)}.btn{border:1px solid #51628c;border-radius:10px;padding:10px 15px;background:#263454;font-weight:750;transition:.15s}.btn:hover{background:#364771}.btn.primary{color:#09111c;background:var(--b);border-color:var(--b)}.btn.primary:hover{filter:brightness(1.09)}.btn.ghost{background:transparent;border-color:var(--edge)}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.tag{display:inline-block;font-size:11px;color:#b6c0e7;border:1px solid #45516c;border-radius:15px;padding:3px 9px;margin:3px 3px 3px 0}.lesson{max-width:920px}.lesson section{margin:25px 0}.lesson ul,.lesson ol{color:#c6cee1;padding-left:24px}.lesson li{margin:8px 0}.callout{border-left:3px solid var(--b);padding:14px 19px;background:#142228;border-radius:0 10px 10px 0;margin:17px 0}.callout.warn{border-color:var(--gold);background:#282218}.foot{vertical-align:super;font-size:10px;color:var(--b);margin-left:2px;text-decoration:none;border:none;background:none;padding:1px 2px}.foot:hover{color:var(--b);text-decoration:underline}.term{border-bottom:1px dotted var(--a);cursor:help;color:#e1e7ff}.termsheet{padding:14px 18px;background:#1b2435;border:1px solid #53627a;border-radius:14px}.termsheet strong{color:#aebfff}.quizQuestion{margin:21px 0;padding:21px;border-radius:14px;background:#161e2d;border:1px solid var(--edge)}.choice{display:block;width:100%;text-align:left;border:1px solid #45516a;border-radius:10px;background:#1c2637;color:#edf0fa;padding:11px 13px;margin:8px 0}.choice:hover{border-color:#9aadfa}.choice.good{border-color:var(--b);background:#153b36}.choice.bad{border-color:var(--bad);background:#412331}.feedback{margin:9px 0;padding:11px 14px;border-radius:9px;background:#253349;color:#d5e8f5}.progressrow{display:flex;align-items:center;justify-content:space-between;gap:20px}.control{width:100%;accent-color:var(--b)}label{display:block;color:#d0d9ee;font-size:13px;margin:12px 0 5px}input[type=number],input[type=search],textarea,select{width:100%;color:white;background:#0c1220;border:1px solid #47536b;border-radius:9px;padding:10px}textarea{min-height:160px;resize:vertical}.score{font-size:34px;letter-spacing:-.04em;font-weight:850;color:var(--b)}.diagram{display:flex;flex-direction:column;align-items:center;gap:5px}.node{border:1px solid #536584;background:#243149;border-radius:12px;padding:11px 16px;text-align:center;min-width:250px;max-width:100%;font-weight:750}.node small{display:block;font-weight:400;color:#d1dbf2}.arrow{color:var(--b)}.nodeRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.nodeRow .node{min-width:120px;font-size:13px}.stickybar{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}.flashcard{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid #7d8cb5;border-radius:18px;background:linear-gradient(135deg,#253457,#151e35);padding:28px;cursor:pointer}.flashcard h3{font-size:27px;margin:4px 0}.flashcard .mini{margin-top:14px}.scenarioChoice{border:1px solid #53617c;background:#1a263b;border-radius:12px;padding:15px;margin:8px 0;cursor:pointer}.scenarioChoice:hover{border-color:var(--b)}.scenarioChoice.selected{border-color:var(--b);background:#173a3b}.ref{font-size:12px;color:var(--muted)}.ref a{color:#b6c3ff}.footnoteRow{padding:13px 0;border-bottom:1px solid #303b50;scroll-margin-top:35px}.kpi{font-size:28px;font-weight:800;color:var(--b)}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#0d1525;padding:15px;border:1px solid #32425c;border-radius:9px;color:#bfe9df;overflow-x:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.mobilehead{display:none}.questionlist{list-style:none;padding:0!important}.questionlist li{background:#151c2c;padding:14px;border-radius:9px;margin:9px 0}.footer{color:var(--muted);font-size:12px;border-top:1px solid var(--edge);margin-top:40px;padding-top:20px}@media(max-width:850px){.app{display:block}aside{display:none;position:fixed;z-index:30;width:280px;box-shadow:0 0 0 100vw #0009}aside.open{display:block}.mobilehead{display:flex;justify-content:space-between;align-items:center;padding:10px 17px;background:#101524;border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:20}.grid,.grid.three{grid-template-columns:1fr}main{padding:23px 17px}.panel{padding:19px}.nodeRow{flex-direction:column}.nodeRow .node{min-width:250px}}@media print{aside,.mobilehead,.buttons,.btn{display:none!important}.app{display:block}main{max-width:none}body{background:white;color:#111}p,.lesson li{color:#222}.panel{background:white;color:#111}h1,h2,h3{color:#111}}

const glossary={SLO:['Service-Level Objective','A measurable target for service reliability, e.g. 99.9% of jobs complete within a specified deadline.'],SLI:['Service-Level Indicator','The actual measured quantity against an SLO, such as proportion of completed jobs.'],SLA:['Service-Level Agreement','A customer-facing contractual commitment, potentially with penalties.'],MTTR:['Mean Time To Recovery','Average time from incident start to restoration; specify how start/end are measured.'],RTO:['Recovery Time Objective','Maximum acceptable time to restore functionality after disruption.'],RPO:['Recovery Point Objective','Maximum acceptable data loss expressed as elapsed time.'],DLQ:['Dead-Letter Queue','Queue for messages that cannot be processed successfully under the normal retry policy.'],DAG:['Directed Acyclic Graph','Dependency graph with directed edges and no cycles; useful for scheduling media stages.'],ASR:['Automatic Speech Recognition','Converts speech audio into text and often word-level timestamps.'],TTS:['Text-to-Speech','Generates synthetic speech from text.'],WER:['Word Error Rate','(Substitutions + deletions + insertions) / reference words; lower is better.'],CER:['Character Error Rate','Character-level transcription error rate; helpful for some scripts and segmentation cases.'],MOS:['Mean Opinion Score','Human subjective rating average, often used for audio perceptual quality.'],VAD:['Voice Activity Detection','Finds regions containing speech.'],FFmpeg:['Fast Forward MPEG (historical name)','Open-source multimedia toolkit for decoding, transforming, and encoding audio/video; project name is not generally expanded in technical discussions.'],GPU:['Graphics Processing Unit','Massively parallel processor often used for ML inference and video workloads.'],CPU:['Central Processing Unit','General-purpose processor, often suited for workflow logic, metadata and some media preprocessing.'],K8s:['Kubernetes','Container orchestration system for scheduling, autoscaling and operating workloads.'],HPA:['Horizontal Pod Autoscaler','Kubernetes mechanism that adjusts replica counts using metrics.'],KEDA:['Kubernetes Event-Driven Autoscaling','Scales worker workloads based on queue length, event sources or custom signals.'],RPC:['Remote Procedure Call','An operation invoked on another process or machine.'],gRPC:['gRPC Remote Procedure Calls','RPC framework supporting strongly typed service interfaces and streaming.'],REST:['Representational State Transfer','Architectural style for web APIs using resources and standard HTTP methods.'],P95:['95th Percentile','Value below which 95% of measured observations fall; usually latency.'],P99:['99th Percentile','Value below which 99% of observations fall; shows tail behavior.'],QPS:['Queries Per Second','A request throughput measure; sometimes better to track media-minutes processed per hour.'],TPS:['Transactions Per Second','Rate of completed transactions; requires a precise transaction definition.'],TTL:['Time To Live','Duration a cache entry, credential, or record remains valid.'],ADR:['Architecture Decision Record','Short document recording context, options, decision and consequences.'],RBAC:['Role-Based Access Control','Permissions assigned through roles.'],ABAC:['Attribute-Based Access Control','Authorization based on resource, subject, and context attributes.'],PII:['Personally Identifiable Information','Information that can identify or be linked to a person, subject to jurisdiction-specific definitions.'],DRM:['Digital Rights Management','Technical controls governing access to protected media.'],IAM:['Identity and Access Management','Authentication and authorization for people and services.'],KMS:['Key Management Service','Service for encryption-key generation, protection, and rotation.'],VPC:['Virtual Private Cloud','Logically isolated cloud networking environment.'],CI_CD:['Continuous Integration / Continuous Delivery','Automated validation and controlled release of software changes.'],MLOps:['Machine Learning Operations','Operational practices for versioning, deploying, monitoring, and evaluating ML systems.'],LLMOps:['Large Language Model Operations','Operational practices focused on LLM-powered applications, prompts, traces and evals.'],LLM:['Large Language Model','Generative model trained primarily on token sequences, often for text or multimodal tasks.'],RAG:['Retrieval-Augmented Generation','Retrieves relevant material to ground a generative model response.'],HITL:['Human In The Loop','Human reviews or steers selected workflow decisions.'],OOD:['Out Of Distribution','Inputs materially different from a model’s training or evaluation distribution.'],A_B:['A/B Test','Controlled comparison of randomized traffic across alternatives.'],Canary:['Canary Deployment','Release a change to limited production traffic before broader rollout.'],BlueGreen:['Blue-Green Deployment','Maintain two production environments to switch traffic between old and new versions.'],CircuitBreaker:['Circuit Breaker','Temporarily stops dependency calls after observed failures to avoid amplification.'],Bulkhead:['Bulkhead Isolation','Separate capacity pools to prevent failures in one workload from cascading.'],Backpressure:['Backpressure','Mechanism that slows or rejects incoming work when downstream capacity is saturated.'],Idempotency:['Idempotency','Repeating the same logical operation does not create extra side effects.'],Checkpoint:['Checkpoint','Durably recorded progress enabling resumption without recomputing completed work.'],ExactlyOnce:['Exactly-Once Semantics','Guarantee that a logical effect occurs once; difficult across external systems without transactional support.'],AtLeastOnce:['At-Least-Once Delivery','Messages can be delivered multiple times; consumers must handle duplicates.'],Jitter:['Jitter','Random variation in retry timing to avoid synchronized retry storms.'],Trace:['Distributed Trace','Correlated record showing a request or workflow across services and spans.'],OTel:['OpenTelemetry','Open standard/tooling for traces, logs and metrics instrumentation.'],FinOps:['Financial Operations','Discipline of managing and optimizing cloud/AI spend with financial accountability.'],TCO:['Total Cost of Ownership','All-in lifecycle costs, including infrastructure, personnel, licenses and downtime.'],COGS:['Cost Of Goods Sold','Direct costs of delivering a service, including paid inference and infrastructure.'],CAC:['Customer Acquisition Cost','Acquisition spend divided by newly acquired customers; less directly relevant to media pipeline unit economics.'],Pareto:['Pareto Frontier','Set of options where improving one objective requires worsening another.'],ASR_DIAR:['Speaker Diarization','Determines who spoke when; separate from transcribing what was said.'],LipSync:['Lip Synchronization','Temporal alignment of audible speech with visible mouth motion.'],WER2:['First-Pass Acceptance Rate','Percentage of generated items passing all defined gates without rework.'],WER3:['Cost Per Accepted Output','All processing, retry, QA and infrastructure costs divided by outputs actually accepted.'],Rights:['Rights Provenance','Auditable evidence of source ownership, licenses, scope of permitted transformations, and consent.'],Golden:['Golden Dataset','Representative, curated evaluation examples used repeatedly to detect regressions.'],Judge:['LLM-as-a-Judge','Use of a language model to score outputs against a rubric; requires human calibration.'],Calibration:['Calibration','Agreement between stated confidence/score and observed outcomes; important for automation thresholds.'],Brier:['Brier Score','Mean squared difference between predicted probability and observed binary outcome.'],Egress:['Data Egress','Moving data out of a cloud network or provider, often creating extra costs.'],ABR:['Adaptive Bitrate','Streaming approach that switches among encoded variants based on bandwidth.'],HLS:['HTTP Live Streaming','Segment-based adaptive media streaming protocol.'],Manifest:['Manifest','Machine-readable index of media files, versions, segment maps and metadata.'],ContentHash:['Content-Addressed Storage','Store or identify assets using a hash of their contents for deduplication and integrity checks.'],QueueAge:['Oldest Queue Age','Elapsed time oldest pending work has waited; useful saturation signal.'],WIP:['Work In Progress','Number of active jobs or tasks; bounding WIP helps prevent overload.'],Pod:['Kubernetes Pod','Smallest deployable Kubernetes unit, holding one or more closely coupled containers sharing network and storage context.'],Deployment:['Kubernetes Deployment','Declaratively maintains a desired number of replica Pods, supporting rolling updates and rollback for long-lived services.'],K8sJob:['Kubernetes Job','Creates Pods to complete finite tasks; unlike a Deployment, its aim is successful task completion, not continuously serving requests.'],Autoscaling:['Autoscaling','Automatically adjusts replicas or computing capacity in response to load; policies must avoid creating runaway provider or GPU cost.'],RequestsLimits:['Resource Requests and Limits','Requests influence scheduling and guaranteed resource reservation; limits constrain usage, and CPU throttling or out-of-memory termination can occur.'],GPUScheduling:['GPU Scheduling','Assigns accelerator-requiring Pods to appropriate GPU-equipped nodes using device plugins, resource requests and node placement policies.'],Node:['Kubernetes Node','Worker machine (virtual or physical) where Pods run; its health and capacity impact workloads.'],OOM:['Out Of Memory','Condition where memory usage exceeds available or enforced capacity, potentially terminating the process or container.'],Readiness:['Readiness Probe','Health signal indicating whether a Pod should receive service traffic; distinct from whether the process is alive.'],Liveness:['Liveness Probe','Health signal for determining whether a container should be restarted. Avoid using it to restart merely slow jobs.'],PlatformSRE:['Site Reliability Engineering','Engineering discipline using observability, automation and SLOs to operate services reliably; may overlap with platform engineering.'],Uptime:['Uptime Commitment','Availability or processing guarantee expressed as an SLO or customer SLA, requiring measurement, ownership and incident response.']};
Object.assign(glossary,{Codec:['Codec', 'Encoder/decoder for compressing or reconstructing audio or video. Examples include H.264, HEVC, AV1, AAC and Opus.'],
Container:['Media Container', 'File wrapper such as MP4, MOV, MKV or WebM that packages encoded streams, timestamps and metadata; distinct from a codec.'],
Transcode:['Transcoding', 'Decode and re-encode media into a different codec, bitrate, resolution or profile; differs from remuxing without re-encoding.'],
Remux:['Remultiplexing', 'Move existing compressed streams to another media container without re-encoding when compatible.'],
GOP:['Group of Pictures', 'Sequence of encoded frames between keyframes; affects seeking, compression efficiency and segment boundaries.'],
VFR:['Variable Frame Rate', 'Video whose frame spacing varies; timestamp handling matters for subtitle timing and sync.'],
PTS:['Presentation Timestamp', 'When a decoded video/audio frame should be presented; critical to synchronization.'],
LUFS:['Loudness Units relative to Full Scale', 'Perceived-program loudness measure used to normalize audio to distribution targets.'],
TruePeak:['True Peak', 'Estimated inter-sample peak amplitude; must be limited to avoid clipping after encoding/playback.'],
SRT:['SubRip Text', 'Widely supported subtitle file format with numbered cue blocks and time intervals.'],
WebVTT:['Web Video Text Tracks', 'Web-native text track format for captions and timed subtitles; supports cue settings.'],
TTML:['Timed Text Markup Language', 'XML-based timed text format used in some broadcast and OTT delivery workflows.'],
ForcedSubs:['Forced Subtitles', 'Subtitles shown only for essential foreign-language dialogue or on-screen text, independent of ordinary subtitles.'],
Diarization:['Speaker Diarization', 'Determine which speaker is active at each time; speaker ID assignment may need reconciliation across segments.'],
Prosody:['Prosody', 'Timing, stress, rhythm, pauses and intonation that carry naturalness and emotion in speech.'],
VoiceClone:['Voice Cloning', 'Generate speech resembling a person from reference audio; requires documented rights and consent.'],
ForcedAlign:['Forced Alignment', 'Match known transcript text to precise times in audio, typically by word or phoneme.'],
Viseme:['Viseme', 'Visual mouth shape corresponding to one or more speech sounds; used for facial animation and lip-sync.'],
SceneDetection:['Scene and Shot Detection', 'Identify boundaries between shots or broader scenes using visual, audio and semantic evidence.'],
MultimodalEmb:['Multimodal Embedding', 'Vector representation connecting content across modalities such as images, video, audio and text.'],
ClipRanking:['Clip Ranking', 'Scoring candidate segments for salience, narrative coherence, safety, novelty and audience suitability.'],
VRAM:['Video Random Access Memory', 'Memory available to a GPU; weights, activations, KV cache and batch sizes compete for capacity.'],
Quantization:['Model Quantization', 'Reduce numeric precision of weights or activations to lower memory/compute, potentially impacting accuracy.'],
Batching:['Inference Batching', 'Combine requests to improve accelerator utilization, while considering latency and variable-length workloads.'],
KVCache:['Key-Value Cache', 'Transformer inference state for attention; can significantly affect memory usage and throughput.'],
GPUUtil:['GPU Utilization', 'Fraction of time compute engines are busy; pair with throughput, memory and latency to avoid misleading conclusions.'],
BreakEven:['Break-Even Utilization', 'Workload utilization level at which self-hosted infrastructure becomes less expensive than external inference.'],
ANN:['Approximate Nearest Neighbor', 'Indexing/search technique that finds similar vectors without exhaustive comparison.'],
VectorDB:['Vector Database', 'Storage and retrieval system optimized for similarity search over embeddings plus metadata filters.'],
HybridSearch:['Hybrid Search', 'Combine lexical or keyword retrieval with semantic vector retrieval, often with reranking.'],
Rerank:['Reranking', 'Second-stage model sorts retrieved candidates by relevance to a query or goal.'],
RecallK:['Recall at K', 'Share of relevant matches captured in the first K retrieved candidates, based on labeled evaluation data.'],
ACL:['Access Control List', 'Per-resource permissions identifying who can access content. Search must enforce ACLs at retrieval and delivery.'],
OTT:['Over-The-Top', 'Media content delivered over the internet outside traditional cable or broadcast distribution.'],
CMS:['Content Management System', 'Platform storing content assets, editorial metadata, publishing state and permissions.'],
MAM:['Media Asset Management', 'System organizing media files, metadata, versions, proxies, licenses and production workflows.'],
QC:['Quality Control', 'Automated and/or manual technical and editorial checks before content delivery.'],
CDN:['Content Delivery Network', 'Distributed network for efficient delivery of media to viewers.'],
EME:['Encrypted Media Extensions', 'Browser APIs supporting encrypted playback with CDM/DRM systems.'],
SCTE35:['SCTE-35', 'Signaling standard commonly used for ad insertion and program events in broadcast/streaming workflows.']});
const F=(term)=>`<button class="foot" data-foot="${term}" title="Explain ${term}">[${term}]</button>`;const T=(term)=>`<span class="term" data-foot="${term}">${term}</span>${F(term)}`;
const lessons=[
{id:'foundation',name:'01 · Production mindset',duration:'15 min',tag:'Systems',intro:'Define the problem before choosing technologies. Principal-level systems design is about guarantees, constraints and measurable outcomes.',sections:[['Frame the problem',`Ask for source hours/day, catalog sizes, average duration, tenant count, supported languages, turnaround SLO ${F('SLO')}, output quality, permissible usage rights, and budget. Distinguish burst throughput from steady state. A platform that ingests 10,000 hours/day is not necessarily generating 10,000 hours of output per day.`],['Define two planes',`<b>Control plane:</b> job admission, rights validation, pipeline configuration, scheduling, ledger, tenant quotas, model selection and metadata. <b>Data plane:</b> CPU ${F('CPU')}/GPU ${F('GPU')} processing, ASR ${F('ASR')}, translation, TTS ${F('TTS')}, encoding, clip extraction, publishing. Store binaries in object storage, never inside broker payloads.`],['Architecture contracts',`Use immutable artifacts, versioned manifests ${F('Manifest')}, content hashes ${F('ContentHash')}, a stable job schema, typed provider contracts and stage-level outcomes. Persist state transitions transactionally when feasible and make each external side effect reconcilable.`],['Throughput math',`If arrivals average 2,400 media hours/day, that is 100 source hours/hour. With 4 independent output languages, a pipeline stage might need 400 output-hour equivalents/hour. Real sizing requires stage-specific real-time factors, parallelism, burst peaks and retry amplification. Use Little’s Law (WIP ≈ throughput × cycle time) as an intuition, not a substitute for workload profiling.`],['Principal soundbite',`“I start with user-visible SLOs, workload distribution, operational constraints, and unit economics. Only then do I select workflow and inference technology.”`]]},
{id:'scaling',name:'02 · Scaling architecture',duration:'20 min',tag:'Architecture',intro:'Understand the bottlenecks, capacity isolation, asynchronous orchestration and 10× growth.',sections:[['The reference design',`<div class="diagram"><div class="node">API + tenant policy <small>authentication, quota, rights</small></div><div class="arrow">↓</div><div class="node">Durable job orchestration <small>state, checkpoints, retry budgets</small></div><div class="arrow">↓</div><div class="nodeRow"><div class="node">Ingest / FFmpeg ${F('FFmpeg')}</div><div class="node">ASR + diarization ${F('ASR_DIAR')}</div><div class="node">Translation + TTS</div></div><div class="arrow">↓</div><div class="node">Versioned quality gates <small>deterministic, learned, human</small></div><div class="arrow">↓</div><div class="node">Publisher + audit + analytics</div><div class="arrow">↓</div><div class="node">Observability & unit-cost ledger <small>cross-cutting at every step</small></div></div>`],['Scale workers independently',`Dedicated pools for decode/encode, speech and vision inference; CPU ${F('CPU')} and GPU ${F('GPU')} capacity differ dramatically. Autoscale on queue age ${F('QueueAge')}, service time and GPU utilization—not merely raw queue depth. KEDA ${F('KEDA')} and HPA ${F('HPA')} are options when using Kubernetes ${F('K8s')}. Prioritize paid enterprise workloads with fair-share scheduling.`],['Control backpressure',`Bound simultaneous work in each resource pool, enforce per-tenant concurrency and per-provider request budgets, and use backpressure ${F('Backpressure')} instead of accepting unlimited work. Admission control should communicate expected delay or reject politely when limits are reached.`],['Data-plane efficiency',`For self-hosted inference, dynamic batching can increase GPU utilization but may worsen per-request tail latency; measure throughput, P95 ${F('P95')}, and latency per stage. Cache reusable intermediate artifacts only when rights, parameters, versions, and privacy constraints permit.`],['10× growth scenario',`At 10×, quantify bottlenecks by stage, avoid hot partitions, plan provider quotas, budget for egress ${F('Egress')}, test tenant fairness, and conduct staged load tests with realistic media durations and codecs.`]]},
{id:'reliability',name:'03 · Recovery & reliability',duration:'22 min',tag:'Incidents',intro:'Learn to turn unreliable model APIs into workflows that predictably converge.',sections:[['Failure taxonomy',`<b>Transient:</b> network timeout, 503, 429. <b>Permanent:</b> unsupported audio, invalid credentials, denied rights. <b>Ambiguous:</b> provider produced and billed an output but the acknowledgment was lost. <b>Quality:</b> media exists yet fails semantic or creative criteria. Each requires a different transition.`],['Retries are not free',`Use exponential backoff + jitter ${F('Jitter')}, a retry budget, deadline and provider-aware rate limits. Add circuit breakers ${F('CircuitBreaker')}, bulkheads ${F('Bulkhead')}, and DLQs ${F('DLQ')}. For ambiguous charged requests, reconcile vendor request IDs before replaying when supported.`],['At-least-once reality',`At-least-once delivery ${F('AtLeastOnce')} is common; workers should be idempotent ${F('Idempotency')}. Exactly-once semantics ${F('ExactlyOnce')} are not automatic across an object store, broker, third-party model API and publisher. For publication, combine stable idempotency keys, remote-status reconciliation and an outbox/event log.`],['Resume safely',`Commit checkpoints ${F('Checkpoint')} per independent segment and stage. Preserve source hash, prompt/model versions, result hash, vendor request ID, billing record, QA decision and human review state. Replay only missing or invalid units. A successful stage output is not necessarily an accepted or publishable output.`],['Reliability metrics',`Define SLIs ${F('SLI')}: successful accepted jobs within deadline, workflow completion latency, data integrity, delivery correctness. SLOs ${F('SLO')} define target values; SLAs ${F('SLA')} describe contractual terms. Also measure MTTR ${F('MTTR')}, RTO ${F('RTO')} and RPO ${F('RPO')} when relevant.`]]},
{id:'quality',name:'04 · Evaluation & quality',duration:'23 min',tag:'Evals',intro:'Replace “looks good” with reproducible quality evidence while preserving human creative judgment.',sections:[['Multi-layer gates',`Level 1: deterministic schema, codec, timing, language, subtitle safe-zone, policy. Level 2: specialist models—ASR ${F('ASR')} alignment, diarization ${F('ASR_DIAR')}, semantic checks. Level 3: model-based rubric judge ${F('Judge')}. Level 4: targeted human-in-the-loop ${F('HITL')} review for uncertainty and high risk.`],['Choose meaningful metrics',`For transcripts use WER ${F('WER')} or CER ${F('CER')} on labeled samples. For audio naturalness use blinded MOS ${F('MOS')} ratings. For dubbing test meaning preservation, timing, speaker identity, prosody and lip sync ${F('LipSync')}. For short clips evaluate hook, context integrity, pacing, safe cropping and brand fit.`],['Golden dataset design',`Curate a golden dataset ${F('Golden')} across languages, accents, dialects, fast speech, music, noisy audio, multi-speaker scenes, rights restrictions, branded claims and hard negatives. Use stratified slices and track worst-case failures, not only aggregate averages.`],['Deployment evaluation',`Pair candidate and baseline outputs on the same inputs; blind human reviewers where practical. Analyze disagreements, confidence and calibration ${F('Calibration')}. Include accept/reject precision, cost per accepted output and turnaround. Gate the release, deploy a canary ${F('Canary')}, watch real-world drift, and maintain rollback.`],['Critical distinction',`WER ${F('WER')} measures words, not style. An LLM judge ${F('Judge')} is an imperfect evaluator, not a source of truth. Translation accuracy is not synonymous with embedding similarity. Human scoring must have clear rubrics and inter-rater checks.`]]},
{id:'economics',name:'05 · AI unit economics',duration:'19 min',tag:'FinOps',intro:'Optimize the only cost metric the business truly feels: reliably accepted work.',sections:[['The correct denominator',`<div class="formula">cost_per_accepted_minute = (inference + compute + storage + egress + QA + retries + allocatable overhead) / accepted_output_minutes</div> Compare this to gross minutes generated. Low-cost outputs that fail QA destroy margin. In a financial report distinguish COGS ${F('COGS')} from overall TCO ${F('TCO')}.`],['Provider routing',`Route simple segments to lower-cost models, harder accents or sensitive speech to high-quality models, and route uncertain items to review. Confidence must be calibrated ${F('Calibration')}; the routing policy should be evaluated as a complete system, not selected solely by model benchmark score.`],['Practical levers',`Content-addressed caches ${F('ContentHash')}, segment-level regeneration, shared transcription for multiple languages, smart batching, GPU ${F('GPU')} utilization, prompt/token controls, right-sized resolution, provider volume discounts and scheduling nonurgent work off peak.`],['Hosted vs self-hosted',`Calculate effective GPU hourly cost / useful processed throughput, adjusted for utilization and support staff. Hosted providers have API charges and dependency risk; self-hosted adds reliability, scaling and model update burden. Compare full TCO ${F('TCO')}, data residency, quality and time-to-market.`],['Avoid “cheap model wins”',`A $0.08 attempt with 50% first-pass acceptance can cost more per accepted unit than a $0.12 attempt with 95% acceptance. Account for retries, QA, consistency and customer trust.`]]},
{id:'enterprise',name:'06 · Enterprise & rights',duration:'18 min',tag:'Governance',intro:'For enterprise media, permissions and consent are part of the data pipeline—not a checklist at the end.',sections:[['Tenant isolation',`Partition object paths, database rows, caches and worker access. Use IAM ${F('IAM')}, RBAC ${F('RBAC')} or ABAC ${F('ABAC')} depending on the use case. Encrypt at rest via KMS ${F('KMS')} and in transit; use scoped short-lived access URLs.`],['Rights as first-class metadata',`Store rights provenance ${F('Rights')}, territorial limits, allowed edits, sublicensing, expiration, voice and likeness consent, and permitted downstream publishing. Enforce entitlements at ingest, transformation, external-provider transfer and publishing stages.`],['Auditability',`Preserve who requested a job, what model and version was used, which assets were transformed, review decisions, and where derivatives shipped. Plan revocation: revoke future processing, unpublish where possible, and track deletion of derived assets and caches.`],['Product + legal collaboration',`Rights and brand claims are cross-functional. Agree early on policy requirements with legal, creative and product. Turn them into executable acceptance criteria, not late-stage subjective exceptions.`],['Data governance',`Support retention policies, PII ${F('PII')} restrictions, regional residency, vendor contractual controls, incident procedures, and clear customer access boundaries.`]]},
{id:'leadership',name:'07 · Technical influence',duration:'18 min',tag:'Leadership',intro:'Principal IC impact is architectural leverage, high-quality decisions, and helping other engineers win.',sections:[['Lead without authority',`Turn disagreement into evidence. Write short ADRs ${F('ADR')} with context, constraints, alternatives, measurable tradeoffs, choice, rollback, and owner. Invite security, product, operations and creative stakeholders to comment before an irreversible decision.`],['Make risks legible',`Describe risk as probability × impact, link it to customer outcomes, give options and explicit decisions needed. Avoid “we should rewrite everything”; show phased migration, blast radius and measurable checkpoints.`],['Demonstrate execution',`Have four stories: (1) production incident, (2) difficult architecture tradeoff, (3) cost/quality improvement, (4) cross-functional conflict. For each tell the stakes, your personal role, actions, measurable effect and what you'd change next time.`],['Use your real work',`CineKit: canonical world state and media pipeline architecture. AdGen and multimodal tooling: model provider adapters, orchestration and experimentation. ClineFlow: persistent state and agent collaboration. FlyrTV/Ultrakam: earlier product and media engineering. Do not attribute unreleased safeguards or fabricated production scale to those projects.`],['First 90 days',`Days 1–30: diagram the system, establish trust, baseline SLOs ${F('SLO')}, QA and unit costs. Days 31–60: ship a bounded improvement and model bake-off. Days 61–90: publish a measured 10× risk map and phased architecture roadmap.`]]},
{id:'design',name:'08 · System design mastery',duration:'25 min',tag:'Mock interview',intro:'Practice a coherent 30–40 minute design conversation, with explicit assumptions and progressively deeper follow-ups.',sections:[['Opening clarification (3 minutes)',`“What is the peak catalog ingest rate, source duration distribution, languages per asset, turnaround expectation, rights envelope, QA floor, tenant isolation model and monthly spending limit?” Say which assumptions you make if the interviewer declines.`],['High-level design (7 minutes)',`Start with API, object storage, durable orchestration, versioned manifests ${F('Manifest')}, workers and evaluation gates. Clarify control vs data plane, data lineage, checkpoints and tenant/resource boundaries.`],['Deep dive (10 minutes)',`Choose one risk—failure recovery, cost, provider unavailability, quality regression. Trace a single job end to end with an exact failure state and recovery path. Mention backpressure ${F('Backpressure')}, P95 ${F('P95')}, fairness, circuit breakers ${F('CircuitBreaker')} and replay.`],['Make numbers real (5 minutes)',`Estimate jobs/day × avg duration × output fan-out × service time; compare arrival rate to processing capacity. Size storage and network egress ${F('Egress')}. Compute costs using accepted outputs, not attempted outputs.`],['Leadership conclusion (3 minutes)',`Close with migration phases, risk register, evaluation gates, ownership, ADR ${F('ADR')} and three monitoring dashboards: business outcome, reliability and financial performance.`],['Five interview traps',`Avoid claiming exactly-once delivery without scope; treating all 429s as retry-immediately; deploying model judges without calibration; equating GPU utilization with customer success; and optimizing dollars per generated minute rather than accepted minute.`]]},
{id:'kubernetes',name:'09 · Kubernetes & production ownership',duration:'20 min',tag:'Infrastructure',intro:'Know enough Kubernetes to design and troubleshoot reliable AI services—without mistaking this Principal AI role for full-time cluster administration.',sections:[
['Is this a DevOps role?',`<div class="callout"><b>Core responsibility:</b> architecture and operation of reliable AI pipelines—not necessarily provisioning clusters from scratch. The job emphasizes production uptime ${F('Uptime')}, so expect to diagnose failures across app and infrastructure layers, even if a separate DevOps or SRE ${F('PlatformSRE')} team manages the cluster.</div><p>Ask the AI Lead: “Does a platform team own cluster provisioning and operations, or would the Principal Engineer also be expected to operate the underlying Kubernetes environment?”</p>`],
['Pods, Deployments, and Jobs',`A Pod ${F('Pod')} is where containers run; a Deployment ${F('Deployment')} keeps stateless API services or continually running worker processes replicated and healthy. A Kubernetes Job ${F('K8sJob')} is finite work intended to finish—useful for batch media processing. A durable workflow engine may orchestrate many Jobs, but Kubernetes Jobs alone do not supply your business workflow state, vendor reconciliation, or media quality gating.<div class="diagram"><div class="node">API / Workflow control plane</div><div class="arrow">↓</div><div class="nodeRow"><div class="node">Deployment <small>HTTP API, pollers, worker service</small></div><div class="node">Job <small>finite FFmpeg or inference task</small></div></div><div class="arrow">↓</div><div class="node">Pods on Nodes ${F('Node')} <small>CPU/GPU, resources, health</small></div></div>`],
['Autoscaling and capacity',`Autoscaling ${F('Autoscaling')} changes worker replicas based on work. For AI processing, queue age, pending segment minutes, GPU utilization, and provider rate limits are more meaningful than CPU alone. Scale-out may require provisioning additional Nodes ${F('Node')} and can take time; enforce tenant fairness and budget ceilings. Never let a retry storm trigger uncontrolled scale-up.`],
['Requests, limits, and GPU scheduling',`Resource requests and limits ${F('RequestsLimits')} determine scheduling feasibility and constrain resource consumption. Too-small memory limits cause OOM ${F('OOM')} kills; excessive requests strand capacity. GPU scheduling ${F('GPUScheduling')} involves compatible accelerator Nodes, device plugins, GPU resource requests, and placement constraints. Discuss performance vs utilization, not just “add GPUs.”`],
['Diagnosing uptime incidents across boundaries',`If media jobs stall, determine whether the issue is application logic, queue backlog, model vendor throttling, Pods ${F('Pod')} restarting, Nodes ${F('Node')} lacking GPU capacity, memory OOM ${F('OOM')}, or downstream storage failure. Compare SLO ${F('SLO')} error-budget impact with logs, traces, queue age and GPU saturation. Readiness ${F('Readiness')} and liveness ${F('Liveness')} checks serve different purposes; an overaggressive liveness probe can make an overloaded service worse.`],
['The interview answer',`<div class="callout">“I don't assume this role owns cluster provisioning, but I do take responsibility for production outcomes. I can reason about Pods, Deployments, Jobs, autoscaling, resource requests/limits and GPU scheduling, and collaborate with platform engineers to identify application-versus-infrastructure failure modes. I'd verify who owns Kubernetes operations and what the team's uptime commitments are.”</div><p><b>Preparation priority:</b> be fluent conceptually; don't memorize <code>kubectl</code> commands unless hands-on cluster operations are explicitly in scope.</p>`],
['Practice challenge',`Your dubbing backlog is increasing while API latency remains normal. GPU workers are Pending and a few active Pods are restarting due to out-of-memory errors. Explain your first 10 minutes: (1) inspect queue age, Pod/Node capacity and scheduling events; (2) identify GPU resource scarcity and memory pressure; (3) mitigate with quotas, safer memory limits and workload priority; (4) communicate the completion-time SLO risk; (5) prevent recurrence with load tests and alerts.`]
],takeaway:'Own reliability end-to-end, not necessarily cluster provisioning. Kubernetes is infrastructure vocabulary you use to diagnose and collaborate.'},
{id:'media',name:'10 · Media engineering',duration:'28 min',tag:'Media systems',intro:'Understand practical media transformations, delivery constraints and quality checks.',sections:[['Codec vs container',`A codec ${F('Codec')} compresses the audio/video stream; a container ${F('Container')} packages streams, timing and metadata. MP4 is not a codec. H.264 is not a container. Remux ${F('Remux')} if streams are compatible and no re-encode is required; transcode ${F('Transcode')} when changing codec, profile, bitrate, size or frame rate. Explain why each re-encode can degrade image quality.`],['Build a safe FFmpeg pipeline',`${T('FFmpeg')} can probe inputs, decode, filter, encode and mux outputs. Conceptual flow: ffprobe validation → demux/decode → trim or scale → audio loudness normalize → encode target profiles → package captions → verify duration, stream layout and sync → store immutable output. Never run arbitrary user-supplied flags unchecked; cap CPU/RAM/time and inspect malformed files.`],['Time and synchronization',`Explain timestamps ${F('PTS')}, variable frame rate ${F('VFR')} and group of pictures ${F('GOP')}. Segment boundaries chosen at arbitrary frames can force re-encoding or make seeking imprecise. Test A/V drift on long outputs and preserve sample/frame clock assumptions. Caption cues must match the final edited timeline, not only the original source.`],['Loudness normalization and subtitles',`Loudness targets are delivery-spec-specific. ${F('LUFS')} measures program loudness; ${F('TruePeak')} protects against clipping. Use measured normalization plus QC, not simple peak gain. ${F('SRT')} and ${F('WebVTT')} encode timed captions; ${F('TTML')} appears in some professional pipelines. Distinguish captions, translated subtitles, and ${F('ForcedSubs')}. Check line lengths, legibility, safe areas, timing and language labels.`],['Practice lab',`A client submits a 4K MOV with variable frame rate, multiple audio tracks and burned-in text. Delivery requires 9:16 H.264 MP4, 48 kHz audio, separate Spanish WebVTT and consistent loudness. Define the probing, track selection, crop policy, transcode, caption timeline conversion, QC and failure recovery. What do you do when source rights do not permit translation?`]],takeaway:'Media correctness depends on codecs, timestamps, technical QC and delivery contracts—not just generative model quality.'},
{id:'speech',name:'11 · Speech & audio AI',duration:'30 min',tag:'Audio ML',intro:'Design accurate, natural and consent-aware multilingual speech workflows.',sections:[['End-to-end dubbing graph',`Voice activity detection ${F('VAD')} → speech recognition ${F('ASR')} → speaker diarization ${F('Diarization')} → transcript correction → translation → duration-aware adaptation → voice synthesis ${F('TTS')} → forced alignment ${F('ForcedAlign')} → mixing, loudness and QC. Store word timestamps and speaker assignments as versioned intermediate assets so you can retry a single stage.`],['Naturalness and timing',`Speaker diarization answers who spoke when—not what they said. Prosody ${F('Prosody')} captures emotional rhythm, intonation and pauses; assess it with listening tests and not just WER ${F('WER')}. Lip sync ${F('LipSync')} aligns mouth movement, possibly via phoneme-to-viseme ${F('Viseme')} tracking; do not claim a good transcript guarantees believable dubbing.`],['Responsible voice cloning',`Voice cloning ${F('VoiceClone')} needs identity consent, permitted use scope, rights evidence, expiry and revocation handling. Keep provenance and explicit authorization gates before model invocation; route sensitive or ambiguous cases to ${F('HITL')} review. Ensure a fallback authorized synthetic voice is available when a likeness cannot be used.`],['Quality and failure example',`A 15-minute interview has two speakers with overlapping speech; the Spanish dub sounds fluent but assigns one speaker's voice to the other. Diagnose segmentation and ${F('Diarization')} errors, constrain speaker mapping per segment, use aligned reference samples, selectively re-render failed sections and reassess in a blind human ${F('MOS')} review.`],['Practice lab',`Design a per-language release gate that measures omissions, entity preservation, timing, clipping, noise, speaker consistency, prosody and consent. Which checks are deterministic? Which require trained judges? Which warrant human review?`]],takeaway:'Optimize naturalness, semantic accuracy, correct speakers, synchronization, and consent together.'},
{id:'video',name:'12 · Video understanding',duration:'26 min',tag:'Computer vision',intro:'Turn long-form source media into justified, traceable short-form clips.',sections:[['Shot vs scene boundaries',`Shot detection ${F('SceneDetection')} notices camera cuts and transitions; semantic scenes can span multiple shots. Mix frame-level features, audio turn boundaries, transcript sections and temporal context. Detect transitions without fragmenting meaningful dialogue.`],['How to select a highlight',`Generate candidate intervals from transcript, motion, narrative beats and silence boundaries; rank with ${F('ClipRanking')}. Evaluate clarity without original context, hook strength, narrative completeness, factual grounding, brands/rights, platform length and caption fit. Provide timestamps and evidence for each selection to support editorial overrides.`],['Cross-modal indexing',`${F('MultimodalEmb')} link frames, spoken text, audio and user queries in a shared or interoperable representation. Index segment-level embeddings with timestamps and source IDs. Combine semantic similarity with domain rules, caption availability and editorial signals to avoid aesthetically interesting but irrelevant results.`],['Temporal pitfalls',`Single-frame visual classifiers lose action and causality; caption and transcript retrieval can miss visual events. Use temporal windows, shot aggregation and cross-modal re-ranking. Evaluate retrieval on temporal ground truth and test false highlight selection per content genre.`],['Practice lab',`A podcast has 90 minutes of mostly static cameras and 20 strong claims, but the model proposes clips of guests smiling rather than compelling statements. Explain candidate generation, transcript salience ranking, cuts aligned to sentence boundaries, length constraints and a human editorial feedback loop.`]],takeaway:'A highlight generator needs narrative selection and timestamp-grounded evidence, not just visual embeddings.'},
{id:'gpuhost',name:'13 · Self-hosting on GPUs',duration:'28 min',tag:'Inference infrastructure',intro:'Decide whether self-hosting open models beats vendor APIs without hand-waving.',sections:[['Build versus buy',`Compare provider price, first-pass quality, latency, throughput, available models, privacy/licensing and ${F('TCO')}. A cheaper GPU-hour rate does not mean cheaper accepted minutes if utilization ${F('GPUUtil')} is low or operations are expensive. Include engineering on-call, storage, networking, idle time and rollback.`],['Capacity model',`Estimate peak requests/second or media-minutes/hour; benchmark throughput at representative model sizes, batching ${F('Batching')} and concurrency. ${F('VRAM')} needs to accommodate weights, runtime activations and sometimes ${F('KVCache')}; ${F('Quantization')} can improve fit while changing output quality. Plan headroom, warm-up and degradation under spikes.`],['Serving architecture',`Keep routing/control services separate from GPU workers. Version model weights, inference runtime, container image and evaluation suite. Scale on queue age and measured throughput, not GPU utilization alone. Account for cold starts, job cancellation, preemption, capacity zones and container/GPU compatibility. Kubernetes GPU scheduling ${F('GPUScheduling')} is one approach, not the entire platform strategy.`],['A worked comparison',`Illustrative: hosted API is $0.20 per accepted media minute. One GPU node costs $2.40/hour and delivers 25 accepted minutes/hour under continuous load, i.e. $0.096/minute *before* staff and infrastructure overhead. At 30% utilization its GPU-only effective cost is about $0.32/accepted minute. Identify break-even utilization ${F('BreakEven')} and how quality or retries change it.`],['Practice lab',`You receive a fixed daily workload plus a six-hour launch spike. Propose hosted-only, self-hosted-only and hybrid routing designs. State assumptions, measure throughput and model quality, calculate idle vs peak cost, and define the condition for reversing your decision.`]],takeaway:'Financially rational GPU self-hosting requires representative throughput benchmarks and measured utilization.'},
{id:'retrieval',name:'14 · Catalog retrieval & vectors',duration:'27 min',tag:'Search architecture',intro:'Build trustworthy search and retrieval over millions of hours of video and audio.',sections:[['Catalog indexing architecture',`Ingest media and rights metadata → extract transcripts, keyframes and segment summaries → embed into ${F('MultimodalEmb')} vectors → store timecoded segments in a ${F('VectorDB')} or ${F('ANN')} index. Maintain source IDs, content version, tenant ID and license metadata. Reindex incrementally as content and models change.`],['Hybrid retrieval and reranking',`Use ${F('HybridSearch')} to balance exact names/quotes with semantic relevance. Retrieve candidates, enforce allowed permissions, apply temporal and catalog filters, then ${F('Rerank')} results for the task. ${F('RAG')} is useful for answering catalog questions, but results should include references to exact asset/timestamp passages.`],['Evaluation and freshness',`Measure ${F('RecallK')} and precision on manually labeled queries, including named entities, multiple languages and visual-only content. Track indexing lag, stale embeddings, duplicate assets, drift following model upgrades and false-positive hits. Search relevance is not guaranteed by vector similarity alone.`],['Enterprise access boundaries',`Search must honor tenant isolation, rights and per-asset permissions ${F('ACL')} *before* revealing a snippet, thumbnail or download URL. Deletion/revocation must invalidate indexes, caches and derivatives. Rights filters belong in retrieval authorization, not just the UI.`],['Practice lab',`A studio asks: 'Find all approved clips where the CEO discusses AI licensing, including dubbed Spanish versions.' Sketch a search plan using lexical and semantic signals, segment metadata, provenance, ACLs, translation links, timestamp citations, and deduplication.`]],takeaway:'Enterprise retrieval must be time-grounded, hybrid, permission-aware and evaluated on real queries.'},
{id:'mediabiz',name:'15 · Media business & enterprise clients',duration:'24 min',tag:'Domain fluency',intro:'Speak credibly to publishers, podcast producers, distribution teams and media rights owners.',sections:[['The real customer workflow',`Publishers may use a ${F('CMS')} for editorial assets and a ${F('MAM')} for mastering, metadata, proxies, and production rights. A workflow can span ingest → edit → ${F('QC')} → legal approval → publish → analytics. Identify the system of record and who can approve transformations before automating.`],['Media distribution reality',`Different channels have format, loudness, subtitle, aspect ratio and rights requirements. ${F('OTT')} delivery may use ABR ${F('ABR')}, ${F('HLS')} packaging and a ${F('CDN')}; advertising workflows may rely on ${F('SCTE35')} markers. Talk in terms of acceptance specifications, metadata and audit trails—not simply exporting MP4 files.`],['Enterprise contract alignment',`Enterprise contracts may define ${F('SLA')}, security controls, consent/voice restrictions, retention, localization review, audit and support escalation. Model SLOs ${F('SLO')} for asset readiness and on-time delivery, tenant-specific quotas, evidence of approvals and an operator override. Don't imply rights are solved by an ML classifier.`],['Engineering and customer leadership',`When a media customer reports incorrect names or a prohibited likeness, triage scope and take affected derivatives out of distribution; partner with legal, creative, customer success, engineering and product. Provide a technical root-cause analysis and contract-aware mitigation plan. Use ${F('ADR')} to record cross-functional decisions.`],['Practice lab',`An enterprise publisher wants 50,000 hours localized into six languages in 45 days, with brand-specific vocabulary and a manual sign-off before publication. Clarify actual source/output minutes, translation expansion, cost ceilings, latency goals, QA sampling and contractual rights. Present a phased delivery plan with risk gates.`]],takeaway:'The Principal role translates editorial/rights/business requirements into enforceable technical contracts.'},
];

const scenarios=[{title:'The mysterious timeout',intro:'A TTS provider times out after 85 seconds on an expensive 45-minute voice job. Your logs show no response. A customer delivery is due in 18 minutes.',opts:[['Retry the whole job immediately','bad','This may duplicate billing and work. Check provider job IDs/status first if available.'],['Check request ID and provider status; recover from durable stage state','good','Correct. Treat timeout as an ambiguous outcome. Reconcile first, retry only missing work, and communicate SLA risk.'],['Mark completed to protect the SLA','bad','You cannot claim success without verifying an artifact.']]},{title:'The 10× spike',intro:'A large enterprise imports 90,000 hours in a day. Queue age grows. Other tenants start missing deadlines.',opts:[['Increase ingestion concurrency without limits','bad','This worsens saturation and noisy-neighbor effects.'],['Introduce quota-aware admission, tiered priorities and scale the measured bottleneck','good','Correct. Protect existing SLOs while scaling independent bottlenecks and communicating wait estimates.'],['Turn off health checks for throughput','bad','It hides the very failure signals you need.']]},{title:'The cheaper model',intro:'Finance wants a model costing $0.06/min instead of $0.11/min. Its first-pass QA acceptance falls from 94% to 56%.',opts:[['Switch because token rates are lower','bad','Per-attempt cost is not per-accepted-output cost.'],['Run paired evaluation, include retries and review, consider tiered routing','good','Correct. Evaluate full economics and quality floor; route simple cases to the cheap model if validated.'],['Reject all affordable models forever','bad','The question is where cheaper models create value safely.']]},{title:'The consent problem',intro:'A customer asks for AI voice cloning. Their media license covers video redistribution but does not explicitly establish performer voice consent.',opts:[['Proceed because redistribution rights suffice','bad','Voice/likeness consent may require distinct authorization.'],['Block cloning pending documented authority and approved consent policy','good','Correct. Rights provenance must gate synthesis before any provider receives the material.'],['Generate first and request consent before publishing','bad','Generation itself may violate contractual or consent requirements.']]},{title:'The stakeholder standoff',intro:'Creative says the model sounds unnatural; engineering says automated scores improved; product wants release Friday.',opts:[['Pick the newest model and release','bad','Higher automated score does not guarantee better perceptual quality.'],['Create a blinded human rubric on representative samples and write the release decision','good','Correct. Tie measurable quality floors, risks and rollout to stakeholder acceptance.'],['Wait until every stakeholder agrees with no deadline','bad','You still need a decision process and owner.']]}];
const stateKey='hassan-uriostegui-academy-2026-v1';let st;try{st=JSON.parse(localStorage.getItem(stateKey))||{}}catch(e){st={}}st.done=st.done||[];st.answers=st.answers||{};st.notes=st.notes||{};st.incident=st.incident||[];let view='home',flashIndex=0,flashFlipped=false,incidentIndex=0,quizFilter='all',glossSearch='';const save=()=>{try{localStorage.setItem(stateKey,JSON.stringify(st))}catch(e){}};const esc=(s)=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const completed=()=>st.done.length;function nav(){const entries=[['home','⌂ · Dashboard'],...lessons.map(x=>[x.id,x.name]),['lab','◈ · Cost lab'],['incident','⚠ · Incident game'],['quiz','✦ · Knowledge arena'],['flash','▣ · Flashcards'],['mock','◉ · Interview simulator'],['glossary','§ · Jargon & footnotes'],['sources','↗ · Research sources']];document.getElementById('nav').innerHTML=entries.map(([id,name])=>`<button class="navitem ${id===view?'active':''}" onclick="go('${id}')"><span>${name}</span>${st.done.includes(id)?'<span class="pill">✓</span>':''}</button>`).join('');document.getElementById('sideProgress').style.width=(completed()/lessons.length*100)+'%';document.getElementById('sideProgressTxt').textContent=`${completed()} / ${lessons.length} lessons completed`};function go(id){view=id;document.querySelector('aside').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})};function shell(title,sub,content){return `<div class="hero"><div class="eyebrow">Hassan Uriostegui · Principal AI Engineer</div><h1>${title}</h1><p class="lead">${sub}</p></div>${content}`};function addFootHandler(){document.querySelectorAll('[data-foot]').forEach(el=>{el.addEventListener('click',()=>{const id=el.dataset.foot;if(glossary[id]){const term=glossary[id];const m=document.getElementById('termModal');m.innerHTML=`<div class="panel" style="max-width:560px;margin:15vh auto;background:#1d2639"><div class="progressrow"><b style="color:var(--b)">${esc(id)} · ${esc(term[0])}</b><button class="btn ghost" onclick="closeTerm()">✕</button></div><p>${esc(term[1])}</p><div class="buttons"><button class="btn primary" onclick="go('glossary');closeTerm();setTimeout(()=>document.getElementById('gloss-${id}')?.scrollIntoView({behavior:'smooth'}),120)">See glossary entry</button></div></div>`;m.classList.remove('hidden')}})});}
function closeTerm(){document.getElementById('termModal')?.classList.add('hidden')}function mark(id){if(!st.done.includes(id))st.done.push(id);else st.done=st.done.filter(x=>x!==id);save();render()}
function render(){nav();const app=document.getElementById('app');let body='';if(view==='home'){body=shell('Learn the platform.\nOwn the architecture.'.replace('\n','<br>'),'A hands-on, gamified training guide for your AI Lead interview: deep technical lessons, real production tradeoffs, jargon footnotes, and no fluff.',`<div class="grid three"><div class="stat"><strong>${lessons.length}</strong><small>Deep learning modules</small></div><div class="stat"><strong>${questions.length}</strong><small>Knowledge checks</small></div><div class="stat"><strong>${Object.keys(glossary).length}+</strong><small>Clickable technical terms</small></div></div><div class="panel"><div class="progressrow"><div><div class="eyebrow">YOUR QUEST</div><h2>Principal Engineer readiness</h2></div><span class="score">${Math.round(completed()/lessons.length*100)}%</span></div><div class="prog"><div style="width:${completed()/lessons.length*100}%"></div></div><p>Learn each module → battle a production incident → optimize cost → prove your knowledge → rehearse architectural leadership.</p><div class="buttons"><button class="btn primary" onclick="go('${lessons.find(x=>!st.done.includes(x.id))?.id||'quiz'}')">${completed()?'Continue training':'Start learning'} →</button><button class="btn" onclick="go('incident')">Play incident game</button><button class="btn ghost" onclick="go('glossary')">Explore glossary</button></div></div><h2>Training pathway</h2><div class="grid">${lessons.map((l,i)=>`<div class="panel" style="margin:0"><span class="tag">${l.tag}</span><span class="tag">${l.duration}</span><h3>${l.name}</h3><p>${l.intro}</p><button class="btn ${st.done.includes(l.id)?'ghost':'primary'}" onclick="go('${l.id}')">${st.done.includes(l.id)?'Review ✓':'Explore →'}</button></div>`).join('')}</div><div class="panel"><h3>🧭 Your north star</h3><p>“I turn probabilistic multimodal models into observable, recoverable, rights-aware production systems, with measurable quality and sustainable cost per accepted output.”</p><p class="mini">Customized to the public Principal AI Engineer, Media Pipelines posting and your CineKit, AdGen, ClineFlow, and earlier media work. Scenarios are synthetic educational examples.</p></div>`)}else if(lessons.some(l=>l.id===view)){const l=lessons.find(l=>l.id===view),idx=lessons.indexOf(l);body=shell(l.name,l.intro,`<div class="lesson"><div class="buttons"><span class="tag">${l.duration}</span><span class="tag">${l.tag}</span><span class="tag">Module ${idx+1} of ${lessons.length}</span></div>${l.sections.map(([title,txt])=>`<section class="panel subtle"><h3>${title}</h3><p>${txt}</p></section>`).join('')}<div class="callout"><b>🎤 Practice out loud:</b> ${[['Explain the difference between the control plane and data plane.','foundation'],['What breaks at 10× throughput and how would you identify it?','scaling'],['A provider times out after completing paid work. What exactly happens?','reliability'],['How would you prove dub quality improved across languages?','quality'],['How do you lower cost without hurting accepted output?','economics'],['Where do rights and consent enforcement belong in the architecture?','enterprise'],['How do you make an architecture decision when teams disagree?','leadership'],['Walk me from the problem statement to a 90-day roadmap.','design'],['How would you diagnose pending GPU Pods and protect production SLOs?','kubernetes'],['When can you remux rather than transcode, and what do you validate?','media'],['How would you evaluate multilingual dubbing for semantic accuracy and performance?','speech'],['How would you select compelling short clips with timestamp-grounded evidence?','video'],['When is self-hosting a GPU model economically justified?','gpuhost'],['How do you combine hybrid retrieval with tenant permissions and timestamp precision?','retrieval'],['How do you translate editorial and rights requirements into enforceable workflows?','mediabiz']].find(x=>x[1]===l.id)?.[0]||'Explain the system design tradeoffs, production failure modes, quality gates, and measurable outcomes.'}</div><label for="notes">Private interview notes / your real-world example</label><textarea id="notes" placeholder="Situation → constraints → your architecture choice → measured result → what you learned" oninput="st.notes['${l.id}']=this.value;save()">${esc(st.notes[l.id]||'')}</textarea><div class="buttons"><button class="btn primary" onclick="mark('${l.id}')">${st.done.includes(l.id)?'Mark as still learning':'Mark module mastered ✓'}</button><button class="btn" onclick="go('${lessons[idx+1]?.id||'incident'}')">Next quest →</button></div><p class="mini">Click any superscript jargon footnote to open its plain-English explanation.</p></div>`)}else if(view==='lab'){body=shell('💸 Cost optimization lab','Experiment with routing, model cost, acceptance rate and demand. Learn why cheap requests can generate expensive outcomes.',`<div class="grid"><div class="panel"><h3>Primary model</h3><label>Processing cost per attempt ($ / output minute)</label><input id="c1" type="range" class="control" min="0.02" max="0.40" step="0.01" value="0.12" oninput="calc()"><div id="c1v"></div><label>First-pass acceptance %</label><input id="a1" type="range" class="control" min="40" max="100" step="1" value="93" oninput="calc()"><div id="a1v"></div></div><div class="panel"><h3>Challenger model</h3><label>Processing cost per attempt ($ / output minute)</label><input id="c2" type="range" class="control" min="0.02" max="0.40" step="0.01" value="0.06" oninput="calc()"><div id="c2v"></div><label>First-pass acceptance %</label><input id="a2" type="range" class="control" min="40" max="100" step="1" value="56" oninput="calc()"><div id="a2v"></div></div></div><div class="panel"><h3>Demand & review cost</h3><div class="grid"><div><label>QA + overhead / attempt ($)</label><input type="number" id="qa" min="0" step="0.01" value="0.02" oninput="calc()"></div><div><label>Accepted output minutes / month</label><input type="number" id="vol" min="1" step="1000" value="100000" oninput="calc()"></div></div><div class="grid" id="costResults"></div><div class="callout warn"><b>Model caveat:</b> This simplified estimate treats attempts as independent with constant acceptance probability and constant retry cost. True pipelines need a stage-specific ledger, max-attempt rules, fixed overhead, and failed-job accounting.</div><div class="formula">expected cost / accepted minute = (cost per attempt + QA per attempt) / probability of acceptance</div></div><div class="panel"><h3>Interview challenge</h3><p>What if the lower-cost challenger passes QA for clean studio speech but fails on accented speech? A better design may route by confidence and language rather than replace the entire fleet.</p><p><b>Explain:</b> the evaluation protocol, guardrail, segment router, fallback, and cost reconciliation.</p></div>`);setTimeout(calc,0)}else if(view==='incident'){const s=scenarios[incidentIndex];body=shell('🚨 Production incident simulator','You are the Principal Engineer on call. Make a decision; see the consequences. These scenarios are illustrative.',`<div class="progressrow"><span class="tag">Incident ${incidentIndex+1} / ${scenarios.length}</span><span class="score">${st.incident.filter((x,i)=>Number.isInteger(x)&&scenarios[i]?.opts[x]?.[1]==='good').length}/${scenarios.length}</span></div><div class="panel"><div class="eyebrow">LIVE EXERCISE · ${s.title}</div><h2 style="margin-top:14px">${s.intro}</h2>${s.opts.map(([text,kind,why],i)=>`<div class="scenarioChoice ${st.incident[incidentIndex]===i?'selected':''}" onclick="chooseIncident(${i})"><b>${String.fromCharCode(65+i)}.</b> ${text}</div>`).join('')}<div id="incidentResult">${Number.isInteger(st.incident[incidentIndex])?`<div class="feedback"><b>${s.opts[st.incident[incidentIndex]][1]==='good'?'✅ Sound production judgment':'🔁 Reconsider the tradeoff'}</b><br>${s.opts[st.incident[incidentIndex]][2]}</div>`:''}</div><div class="buttons"><button class="btn primary" onclick="incidentIndex=(incidentIndex+1)%scenarios.length;render()">${incidentIndex===scenarios.length-1?'Replay incidents':'Next incident →'}</button><button class="btn ghost" onclick="incidentIndex=Math.max(0,incidentIndex-1);render()">← Back</button></div></div>`)}else if(view==='quiz'){const qs=questions.map((q,i)=>({q,i})).filter(x=>quizFilter==='all'||x.q[4]===quizFilter),correct=Object.entries(st.answers).filter(([i,a])=>questions[i]&&questions[i][2]===a).length;body=shell('⚡ Knowledge arena','${questions.length} technical questions with explanations and progress saved in your browser.',`<div class="grid three"><div class="stat"><strong>${Object.keys(st.answers).length}/${questions.length}</strong><small>Answered</small></div><div class="stat"><strong>${correct}</strong><small>Correct</small></div><div class="stat"><strong>${Object.keys(st.answers).length?Math.round(correct/Object.keys(st.answers).length*100):0}%</strong><small>Accuracy</small></div></div><div class="panel"><label>Focus area</label><select onchange="quizFilter=this.value;render()"><option value="all">All themes</option>${lessons.map(l=>`<option value="${l.id}" ${quizFilter===l.id?'selected':''}>${l.name}</option>`).join('')}</select></div>${qs.map(({q,i})=>`<div class="quizQuestion"><div class="eyebrow">Question ${i+1}</div><h3>${q[0]}</h3>${q[1].map((a,j)=>`<button class="choice ${st.answers[i]!==undefined&&st.answers[i]===j?(q[2]===j?'good':'bad'):''}" onclick="answer(${i},${j})">${String.fromCharCode(65+j)} · ${a}</button>`).join('')}${st.answers[i]!==undefined?`<div class="feedback"><b>${st.answers[i]===q[2]?'Correct ✓':`Best answer: ${String.fromCharCode(65+q[2])}`}</b><br>${q[3]}</div>`:''}</div>`).join('')}<div class="buttons"><button class="btn ghost" onclick="if(confirm('Clear all quiz answers?')){st.answers={};save();render()}">Reset knowledge arena</button><button class="btn primary" onclick="go('flash')">Go to flashcards →</button></div>`)}else if(view==='flash'){const entries=Object.entries(glossary),[term,definition]=entries[flashIndex%entries.length];body=shell('🗂️ Flashcard deck','Click to flip and test your recall of the systems, AI, finance, and media vocabulary.',`<div class="progressrow"><span class="tag">Card ${flashIndex+1} / ${entries.length}</span><span class="tag">Memory workout</span></div><div class="flashcard" onclick="flashFlipped=!flashFlipped;render()"><div class="eyebrow">${flashFlipped?'THE ANSWER':'WHAT DOES THIS MEAN?'}</div><h3>${flashFlipped?definition[0]:term}</h3>${flashFlipped?`<p>${definition[1]}</p>`:'<p class="mini">Tap to reveal the definition and an example-worthy explanation</p>'}</div><div class="buttons"><button class="btn" onclick="flashIndex=(flashIndex+entries.length-1)%entries.length;flashFlipped=false;render()">← Previous</button><button class="btn primary" onclick="flashIndex=(flashIndex+1)%entries.length;flashFlipped=false;render()">Next →</button><button class="btn ghost" onclick="flashIndex=(flashIndex*17+13)%entries.length;flashFlipped=false;render()">Mix it up ⤨</button></div>`)}else if(view==='mock'){body=shell('🎙️ Principal-level mock interview','Practice clear, structured architectural explanations, then compare against a Principal Engineer answer checklist.',`<div class="panel"><h2>40-minute whiteboard exercise</h2><div class="callout">“Design a system that ingests 100,000 hours of catalog media, extracts short clips, translates and dubs them into five languages, applies quality and rights checks, and publishes accepted outputs. Assume enterprise customers require deadlines and auditability.”</div><div class="grid"><div><h3>Round 1 · Requirements (5m)</h3><p>Clarify input arrival distribution, source durations, tenant fairness, rights, languages, acceptance requirements, deadlines and budget.</p></div><div><h3>Round 2 · Architecture (10m)</h3><p>Control/data planes, asset storage, orchestration, worker pools, provider adapters, manifests and evaluation gates.</p></div><div><h3>Round 3 · Failure injection (10m)</h3><p>Provider timeout during billing, idempotent publish, retry storm, checkpoint recovery, DLQ and detection signals.</p></div><div><h3>Round 4 · Economics (10m)</h3><p>Cost per accepted output, cache hits, segment reuse, quality-routing, GPU utilization and capacity modeling.</p></div><div><h3>Round 5 · Leadership (5m)</h3><p>Architecture decision record, staged rollout, 90-day risk map, compliance signoffs and ownership.</p></div><div><h3>Your success criteria</h3><p>Reproducible, scalable, observable, secure, recoverable and economically validated—not just a diagram that looks impressive.</p></div></div></div><div class="panel"><h3>Record your practice answer</h3><p>Write the architecture in words or dictate into your device. Keep project stories factual, with real constraints and outcomes.</p><textarea id="mockNotes" oninput="st.notes.mock=this.value;save()">${esc(st.notes.mock||'')}</textarea><div class="buttons"><button class="btn primary" onclick="copyMock()">Copy practice answer</button></div></div><div class="panel"><h3>Smart questions for the AI Lead</h3><ol><li>Which is the tightest operational bottleneck: quality gates, inference throughput, or unit economics?</li><li>How do you measure first-pass acceptance, by content type and language?</li><li>What happens today when a provider request returns an ambiguous failure after billing?</li><li>Which architecture decision do you need the Principal Engineer to drive in the first quarter?</li><li>How are voice/likeness consent, content licenses and downstream rights represented in the system?</li></ol></div>`)}else if(view==='glossary'){let keys=Object.keys(glossary).sort((a,b)=>a.localeCompare(b)).filter(k=>(k+' '+glossary[k].join(' ')).toLowerCase().includes(glossSearch.toLowerCase()));body=shell('§ Jargon & footnotes',`A searchable, plain-English glossary of ${Object.keys(glossary).length} essential terms. Every superscript inside lessons links to one of these definitions.`,`<div class="panel"><input aria-label="Search glossary" id="glossSearch" type="search" placeholder="Search: idempotency, SLO, WER, GPU..." value="${esc(glossSearch)}" oninput="glossSearch=this.value;updateGlossary()"><p class="mini">${keys.length} matching terms</p></div><div id="glossItems">${keys.map(k=>`<div id="gloss-${k}" class="footnoteRow"><b style="color:var(--b)">${esc(k)}</b> · <b>${esc(glossary[k][0])}</b><p>${esc(glossary[k][1])}</p></div>`).join('')}</div>`)}else if(view==='sources'){body=shell('📚 Research & further reading','Authoritative material to back up the architecture discussions and deepen your technical preparation.',`<div class="panel"><h3>Job and system design</h3><p><a href="https://docs.temporal.io/workflows" target="_blank" rel="noopener">Temporal — Workflows</a> · durable execution, checkpointing and retry boundaries</p><p><a href="https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/" target="_blank" rel="noopener">AWS Builders’ Library — Making retries safe with idempotent APIs</a></p><p><a href="https://sre.google/sre-book/service-level-objectives/" target="_blank" rel="noopener">Google SRE — Service Level Objectives</a></p><h3>Evaluation and inference</h3><p><a href="https://docs.langchain.com/langsmith/evaluation-types" target="_blank" rel="noopener">LangSmith — Evaluation types (offline vs online, pairwise, code and model judges)</a></p><p><a href="https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/user_guide/batcher.html" target="_blank" rel="noopener">NVIDIA Triton — Dynamic batching</a></p><p><a href="https://www.ffmpeg.org/documentation.html" target="_blank" rel="noopener">FFmpeg official documentation</a></p><h3>Media, speech and search</h3><p><a href="https://ffmpeg.org/ffmpeg-filters.html" target="_blank" rel="noopener">FFmpeg — Filters and loudnorm</a> · <a href="https://www.w3.org/TR/webvtt1/" target="_blank" rel="noopener">W3C — WebVTT</a> · <a href="https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/" target="_blank" rel="noopener">Kubernetes — Schedule GPUs</a> · <a href="https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/" target="_blank" rel="noopener">NVIDIA Triton — Serving</a></p><p class="mini">Sources explain industry techniques; examples and exercises in this page are educational design scenarios, not verified descriptions of production systems. Company requirements should be checked against the interviewer's current description.</p></div>`)}app.innerHTML=body+`<div class="footer">Owner: Hassan Uriostegui · AI Academy · Interactive offline training · No external tracking or API calls · Progress saved locally in your browser. <button class="btn ghost" style="font-size:11px;padding:5px 8px" onclick="if(confirm('Reset saved lesson progress, notes and quiz results?')){localStorage.removeItem(stateKey);location.reload()}">Reset all local progress</button></div><div class="hidden" id="termModal" style="position:fixed;inset:0;z-index:80;background:#000b;padding:16px;overflow:auto" onclick="if(event.target===this)closeTerm()"></div>`;addFootHandler()}
function answer(i,j){st.answers[i]=j;save();render()}function chooseIncident(i){st.incident[incidentIndex]=i;save();render()}function updateGlossary(){const keys=Object.keys(glossary).sort((a,b)=>a.localeCompare(b)).filter(k=>(k+' '+glossary[k].join(' ')).toLowerCase().includes(glossSearch.toLowerCase()));document.getElementById('glossItems').innerHTML=keys.map(k=>`<div id="gloss-${k}" class="footnoteRow"><b style="color:var(--b)">${esc(k)}</b> · <b>${esc(glossary[k][0])}</b><p>${esc(glossary[k][1])}</p></div>`).join('')}function calc(){const el=id=>document.getElementById(id),c1=+el('c1').value,c2=+el('c2').value,a1=+el('a1').value/100,a2=+el('a2').value/100,qa=Math.max(0,+el('qa').value||0),v=Math.max(0,+el('vol').value||0),e1=(c1+qa)/a1,e2=(c2+qa)/a2;['c1','c2'].forEach(x=>el(x+'v').textContent='$'+(+el(x).value).toFixed(2));['a1','a2'].forEach(x=>el(x+'v').textContent=el(x).value+'%');el('costResults').innerHTML=`<div class="stat"><small>Primary · cost per accepted min</small><strong>$${e1.toFixed(3)}</strong><small>Monthly: $${Math.round(e1*v).toLocaleString()}</small></div><div class="stat"><small>Challenger · cost per accepted min</small><strong>$${e2.toFixed(3)}</strong><small>Monthly: $${Math.round(e2*v).toLocaleString()}</small></div><div class="stat" style="grid-column:1/-1"><small>Best under these simplified assumptions</small><strong>${e1<=e2?'Primary model':'Challenger model'}</strong><small>Modeled difference $${Math.round(Math.abs(e1-e2)*v).toLocaleString()} / month. Quality floor and risk may override this purely economic result.</small></div>`}function copyMock(){const x=st.notes.mock||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(x).then(()=>alert('Copied notes')).catch(()=>alert('Clipboard permission denied'));else alert('Select and copy the text manually.')};window.addEventListener('keydown',e=>{if(e.key==='Escape')closeTerm()});render();</script></body></html>
